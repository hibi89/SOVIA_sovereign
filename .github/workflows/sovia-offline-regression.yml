name: SOVIA offline regression
on:
  push:
    branches: [feature/p0-audit-core, feature/p2-sqlite-history, feature/p2-offline-dashboard, feature/p2-portable-package, feature/p2-owner-selfcheck, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source/tests
        run: python -m compileall -q sovia_audit.py sovia_csv_input.py sovia_pdf.py sovia_history.py sovia_dashboard.py build_portable.py verify_portable.py portable_smoke.py owner_selfcheck.py tests
      - name: Run stdlib regression (optional PDF cases may skip)
        run: python -m unittest discover -s tests -v

      - name: Verify extracted beta ZIP end-to-end (isolated Python)
        run: python portable_smoke.py
      - name: Build downloadable synthetic portable beta
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
          python build_portable.py --output dist/SOVIA-Audit-Lite-0.10.0-beta.zip
          python verify_portable.py --archive dist/SOVIA-Audit-Lite-0.10.0-beta.zip --sha256-file dist/SOVIA-Audit-Lite-0.10.0-beta.zip.sha256
      - name: Publish synthetic portable beta as CI artifact (not release)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sovia-portable-beta
          path: |
            dist/SOVIA-Audit-Lite-0.10.0-beta.zip
            dist/SOVIA-Audit-Lite-0.10.0-beta.zip.sha256
          if-no-files-found: error
          retention-days: 14
