name: SOVIA offline regression
on:
  push:
    branches: [feature/p0-audit-core]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source/tests
        run: python -m compileall -q sovia_audit.py sovia_csv_input.py sovia_pdf.py tests
      - name: Run stdlib regression (optional PDF cases may skip)
        run: python -m unittest discover -s tests -v
